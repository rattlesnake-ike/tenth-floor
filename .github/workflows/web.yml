# Builds the game for the web with pygbag and publishes it to GitHub Pages on every push to main.
# Play it at https://rattlesnake-ike.github.io/tenth-floor/
name: play in the browser
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenth-floor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag==0.9.3
      - run: python -m pygbag --build --title "Tenth Floor" tenth-floor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tenth-floor/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
